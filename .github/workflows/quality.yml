name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-synthesis.txt
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check -r requirements-synthesis.txt
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run catalog:validate
      - run: npm run synthesis:validate
      - name: Validate committed synthesis learning artifacts
        run: |
          node --test \
            tests/synthesis-learning-coverage-kpi.test.mjs \
            tests/synthesis-learning-evidence.test.mjs
      - name: Capture committed portable synthesis signature
        run: |
          node --import tsx scripts/synthesis/build-portable-regeneration-signature.mts \
            --mode=semantic > "$RUNNER_TEMP/committed-synthesis-semantic.sha256"
      - run: npm run synthesis:intermediate-3d
      - run: npm run synthesis:learning-kpi
      - name: Verify portable semantics and runner-local determinism
        run: |
          node --import tsx scripts/synthesis/build-portable-regeneration-signature.mts \
            --mode=semantic > "$RUNNER_TEMP/generated-synthesis-semantic.sha256"
          diff -u \
            "$RUNNER_TEMP/committed-synthesis-semantic.sha256" \
            "$RUNNER_TEMP/generated-synthesis-semantic.sha256"
          node --import tsx scripts/synthesis/build-portable-regeneration-signature.mts \
            --mode=bytes > "$RUNNER_TEMP/first-run-synthesis-bytes.sha256"
          npm run synthesis:intermediate-3d
          npm run synthesis:learning-kpi
          node --import tsx scripts/synthesis/build-portable-regeneration-signature.mts \
            --mode=bytes > "$RUNNER_TEMP/second-run-synthesis-bytes.sha256"
          diff -u \
            "$RUNNER_TEMP/first-run-synthesis-bytes.sha256" \
            "$RUNNER_TEMP/second-run-synthesis-bytes.sha256"
      - run: npm run licenses:check
      - run: npm run build
      - run: node --test tests/*.test.mjs
      - name: Validate V2.1 visual release evidence
        run: |
          for file in \
            docs/assets/v21/home-featured-idle-start.png \
            docs/assets/v21/home-featured-idle-after-3s.png \
            docs/assets/v21/home-featured-selected-state.png \
            docs/assets/v21/beta-sitosterol-basic-record.png \
            docs/assets/v21/propranolol-curated-dossier.png \
            docs/assets/v21/empty-adme-compact.png \
            docs/assets/v21/atlas-spatial-student.png \
            docs/assets/v21/lab-ketcher.png \
            docs/assets/v21/home-featured-10s.mp4
          do
            test -s "$file"
          done
      - name: Validate retained Molevren Phase A brand references
        run: |
          for file in \
            docs/assets/molevren/brand-board.png \
            docs/assets/molevren/logo-light.png \
            docs/assets/molevren/logo-dark.png \
            docs/assets/molevren/favicon-preview.png \
            docs/assets/molevren/home-tr.png \
            docs/assets/molevren/home-en.png \
            docs/assets/molevren/home-motion-off.png \
            docs/assets/molevren/home-motion-on.png \
            docs/assets/molevren/atlas-browse.png \
            docs/assets/molevren/atlas-spatial.png \
            docs/assets/molevren/basic-record.png \
            docs/assets/molevren/dossier-story.png \
            docs/assets/molevren/dossier-reference.png \
            docs/assets/molevren/academy.png \
            docs/assets/molevren/nomenclature.png \
            docs/assets/molevren/lab.png \
            docs/assets/molevren/mobile-home.png \
            docs/assets/molevren/capture-manifest.json
          do
            test -s "$file"
          done

  browser:
    runs-on: ubuntu-latest
    # Software-rendered molecular browser acceptance is intentionally exhaustive
    # and can exceed 25 minutes on shared GitHub runners. Keep the full suite.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1/3
            release_artifact: false
          - shard: 2/3
            release_artifact: false
          - shard: 3/3
            release_artifact: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --shard=${{ matrix.shard }}
        env:
          PLAYWRIGHT_BROWSER: chromium
          PLAYWRIGHT_PERFORMANCE_PROFILE: shared-software-renderer
      - run: npm run build:pages
        if: matrix.release_artifact
      - run: npm run synthesis:boundary
        if: matrix.release_artifact
      - run: npm run e2e:pages
        if: matrix.release_artifact
        env:
          PLAYWRIGHT_BROWSER: chromium
      - name: Validate GitHub Pages artifact boundary
        if: matrix.release_artifact
        run: |
          test -s dist-pages/index.html
          test -s dist-pages/THIRD_PARTY_NOTICES.txt
          test -d dist-pages/assets
          test -s dist-pages/structures/pubchem/cid-4946-3d.sdf
          test -s dist-pages/catalog/synthesis/manifest.json
          test -s dist-pages/catalog/synthesis/reports/coverage.json
          test -s dist-pages/catalog/synthesis/reports/licensing.json
          test -s dist-pages/catalog/synthesis/reports/baseline-candidate-snapshot.json
          test -s dist-pages/catalog/synthesis/reports/candidate-terminalization.json
          test -s dist-pages/catalog/synthesis/reports/document-dedupe.json
          test -s dist-pages/catalog/synthesis/reports/journal-identity-audit.json
          test -s dist-pages/catalog/synthesis/reports/molecule-best-outcome.json
          test -s dist-pages/catalog/synthesis/reports/route-distribution.json
          test -s dist-pages/catalog/synthesis/reports/license-rights.json
          test -s dist-pages/catalog/synthesis/reports/error-summary.json
          test -s dist-pages/catalog/synthesis/reports/ord-resolution.json
          test -s dist-pages/catalog/synthesis/reports/intermediate-3d-assets.json
          test -s dist-pages/catalog/synthesis/reports/continuous-learning-coverage.json
          test -s dist-pages/catalog/synthesis/reports/targeted-gap-records.json
          test -d dist-pages/catalog/synthesis/intermediate-3d
          test -n "$(find dist-pages/catalog/synthesis/intermediate-3d -maxdepth 1 -type f -name '*.sdf' -print -quit)"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readdir, readFile } from "node:fs/promises";

          const directory = "dist-pages/catalog/synthesis/intermediate-3d";
          const manifestPath =
            "dist-pages/catalog/synthesis/reports/intermediate-3d-assets.json";
          const manifest = JSON.parse(await readFile(manifestPath, "utf8"));
          if (manifest.schemaVersion !== 1 || !Array.isArray(manifest.entries)) {
            throw new Error("Unsupported intermediate 3D manifest in Pages artifact.");
          }
          const prefix = "/catalog/synthesis/intermediate-3d/";
          const generated = manifest.entries.filter((entry) =>
            entry?.threeD?.publicPath?.startsWith(prefix)
          );
          if (
            generated.length < 1 ||
            manifest.summary?.rdkitGeneratedRouteBoundaryMaterial3dAssetCount !==
              generated.length
          ) {
            throw new Error("Intermediate 3D manifest count does not match Pages assets.");
          }
          const expectedFiles = new Set();
          for (const entry of generated) {
            const publicPath = entry.threeD.publicPath;
            const fileName = publicPath.slice(prefix.length);
            if (
              !/^[a-z0-9-]+\.sdf$/u.test(fileName) ||
              !/^[a-f\d]{64}$/u.test(entry.threeD.sha256)
            ) {
              throw new Error(`Unsafe intermediate 3D manifest entry: ${publicPath}`);
            }
            expectedFiles.add(fileName);
            const bytes = await readFile(`${directory}/${fileName}`);
            const actualHash = createHash("sha256").update(bytes).digest("hex");
            if (actualHash !== entry.threeD.sha256) {
              throw new Error(`Intermediate 3D hash mismatch: ${fileName}`);
            }
          }
          const packagedFiles = (await readdir(directory))
            .filter((fileName) => fileName.endsWith(".sdf"));
          if (
            packagedFiles.length !== expectedFiles.size ||
            packagedFiles.some((fileName) => !expectedFiles.has(fileName))
          ) {
            throw new Error("Pages intermediate 3D directory drifted from its manifest.");
          }
          NODE
          test -z "$(find dist-pages -type f \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.p8' -o -name '*.key' -o -name '*.p12' -o -name '*.jks' -o -name '*.keystore' \) -print -quit)"
          test -z "$(find dist-pages -type d -name server -print -quit)"
          if grep -RIlE \
            --include='*.html' --include='*.js' --include='*.css' --include='*.json' --include='*.svg' --include='*.sdf' --include='*.txt' --include='*.map' \
            '(/Users/[^/[:space:]]+/|[A-Za-z]:\\Users\\[^\\[:space:]]+\\|https://[^/[:space:]]*\.chatgpt\.site|BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY|OPENAI_API_KEY|EVIDENCE_API_TOKEN|api\.openai\.com|/api/evidence|github_pat_|gh[pousr]_)' \
            dist-pages
          then
            echo 'Forbidden private, secret, or server-only marker found in Pages artifact.' >&2
            exit 1
          fi
      - name: Upload GitHub Pages artifact
        if: matrix.release_artifact && github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist-pages
          retention-days: 1

  pages-deploy:
    if: github.event_name == 'push'
    needs: [checks, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
